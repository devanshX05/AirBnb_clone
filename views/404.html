<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found</title>
  <link rel="stylesheet" href="/home.css">
  <script src="https://cdn.tailwindcss.com"></script> <!-- this is i have added tailwind css -->
</head>
<body class="bg-gray-50 min-h-screen font-sans flex flex-col">

  <nav class="bg-[#FF5A5F] text-white px-8 py-4 flex gap-6 font-semibold shadow-md w-full">
    <a href="/" class="hover:underline">Go to Home</a>
    <a href="/host/add-home" class="hover:underline opacity-90 hover:opacity-100">Add Home</a>
  </nav>

  <main class="flex-grow flex flex-col items-center justify-center text-center px-4 -mt-16">
    <div class="space-y-6">
      <h1 class="text-7xl font-extrabold text-[#FF5A5F] tracking-tight">404</h1>
      
      <p class="text-2xl font-bold text-gray-700">Oops! Page Not Found</p>
      
      <div class="pt-4">
        <a 
          href="/" 
          class="inline-block bg-[#FF5A5F] text-white font-semibold py-2.5 px-6 rounded-lg hover:bg-[#e04f54] transition shadow-sm cursor-pointer"
        >
          Go Back Home
        </a>
      </div>
    </div>
  </main>

</body>
</html>
